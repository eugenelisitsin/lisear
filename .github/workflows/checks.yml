name: Checks
# Runs on every pull request, and before every deploy (called from deploy.yml).
on:
  pull_request:
  workflow_call:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in www/*.js tools/*.js tests/*.js; do [ -e "$f" ] || continue; node --check "$f" || exit 1; done
      - name: Unit tests
        run: if [ -d tests ]; then node --test tests/; else echo "no tests yet"; fi
      - name: App builds
        run: sh tools/build.sh dist
